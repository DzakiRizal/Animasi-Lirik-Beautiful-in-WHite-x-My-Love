<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java Code Lyric Animation - VS Code Theme</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="vscode-app">
    <div class="vscode-main">
      <div class="vscode-editor-column">

        <div class="vscode-tabs">
          <div class="tab active">
            <span class="tab-icon ts-icon" style="background:#e76f51;">J</span>
            <span class="tab-title">BeautifulInWhiteXMyLove.java</span>
            <span class="tab-dirty-dot" title="Modified">●</span>
            <span class="tab-close">×</span>
          </div>
        </div>

        <div class="vscode-breadcrumbs">
          <span class="crumb-text">java-lyrics</span>
          <span class="crumb-sep">&rsaquo;</span>
          <span class="crumb-text">src</span>
          <span class="crumb-sep">&rsaquo;</span>
          <span class="crumb-text">BeautifulInWhiteXMyLove.java</span>
          <span class="crumb-sep">&rsaquo;</span>
          <span class="symbol-f">f</span>
          <span class="crumb-active">sing()</span>
        </div>

        <div class="editor-window">
          <div id="code-display" class="code-editor"></div>
        </div>

      </div>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>

</html>
